<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hello World Page</title>
</head>
<body>
     {% if is_logged_in %}
     <h1>Welcome Back!</h1>
     {% else %}
     <h1> Please login</h1>
     {% endif %}

     {% if marks >= 90 %}
     <h2>Grade A!</h2>
     {% elif marks >= 75 %}
     <h2>Grade B!</h2>
     {% elif marks >= 50 %}
     <h2>Grade C!</h2>
     {% else %}
    <h2> Fail</h2>
    {% endif %}
</body>
</html>
